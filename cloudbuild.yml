steps:
# 1. Dockerイメージをビルドするステップ（複数タグを付与してロールバック可能に）
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'build'
    - '--target=production'
    # Git commitハッシュをタグに使用（ロールバック時の特定バージョン指定用）
    - '-t'
    - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:$SHORT_SHA'
    # ブランチ名 + commitハッシュ（デバッグ・追跡用）
    - '-t'
    - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:$BRANCH_NAME-$SHORT_SHA'
    # latestタグも継続（互換性維持）
    - '-t'
    - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:latest'
    - '.'

# 2. ビルドしたイメージをArtifact Registryにプッシュするステップ（全タグをプッシュ）
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - '--all-tags'
    - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back'

# 3. 本番DBがbaseline以降としてAlembic管理されていることを確認する
- name: 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:$SHORT_SHA'
  entrypoint: sh
  secretEnv:
    - 'PROD_DATABASE_URL'
  args:
    - '-c'
    - 'export DATABASE_URL="$$PROD_DATABASE_URL"; export ALEMBIC_BASELINE_REVISION=baseline_20260701; exec python scripts/alembic_baseline_guard.py'

# 4. 本番TEST DBがbaseline以降としてAlembic管理されていることを確認する
- name: 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:$SHORT_SHA'
  entrypoint: sh
  secretEnv:
    - 'PROD_TEST_DATABASE_URL'
  args:
    - '-c'
    - 'export DATABASE_URL="$$PROD_TEST_DATABASE_URL"; export ALEMBIC_BASELINE_REVISION=baseline_20260701; exec python scripts/alembic_baseline_guard.py'

# 5. Cloud Runに反映する前に、本番DBと本番TEST DBへAlembic migrationを適用する
- name: 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:$SHORT_SHA'
  entrypoint: python
  secretEnv:
    - 'PROD_DATABASE_URL'
    - 'PROD_TEST_DATABASE_URL'
  args:
    - 'scripts/run_alembic_for_pair.py'
    - '--env'
    - 'prod'
    - 'upgrade'
    - 'head'

# 6. プッシュしたイメージを使ってCloud Runにデプロイするステップ（commit hashタグで明示的にバージョン管理）
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'k-back'
    - '--image'
    - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:$SHORT_SHA'
    - '--region'
    - 'asia-northeast1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'

    # =====================================
    # オートスケーリング設定
    # =====================================
    # コスト最適化: 夜間（14時間）は課金ゼロ
    # 朝のピーク前にCloud Schedulerでウォームアップ（7:50）
    - '--min-instances=0'

    # ピーク時対応: 朝8:00-9:00の集中アクセス
    # 実負荷シミュレーション: 1-2インスタンスで十分（maxScale=5で余裕）
    - '--max-instances=5'

    # バッチ処理対応: Phase 4の10並列処理
    - '--cpu=2'

    # 50並行処理対応: Phase 4目標（メモリ使用量35MB + バッファ）
    - '--memory=1Gi'

    # バッチ処理が常時実行: 夜間0:00-0:10の期限通知
    - '--no-cpu-throttling'

    # バッチ処理時間: 500事業所処理（3分）+ 余裕
    - '--timeout=600'

    # FastAPI + asyncioに最適: I/O待機が多い処理
    - '--concurrency=80'

    # =====================================
    # 環境変数設定
    # =====================================
    - '--set-secrets'
    - '^##^DATABASE_URL=prod-database-url:1##SECRET_KEY=prod-secret-key:1##ENCRYPTION_KEY=prod-encryption-key:1##AWS_ACCESS_KEY_ID=prod-aws-access-key-id:1##AWS_SECRET_ACCESS_KEY=prod-aws-secret-access-key:1##S3_ACCESS_KEY=prod-s3-access-key:1##S3_SECRET_KEY=prod-s3-secret-key:1##MAIL_USERNAME=prod-mail-username:1##MAIL_PASSWORD=prod-mail-password:1##STRIPE_SECRET_KEY=prod-stripe-secret-key:2##STRIPE_WEBHOOK_SECRET=prod-stripe-webhook-secret:1##VAPID_PRIVATE_KEY=prod-vapid-private-key:1##CALENDAR_ENCRYPTION_KEY=prod-calendar-encryption-key:1'
    - '--update-env-vars'
    - '^##^AWS_REGION=ap-northeast-1##S3_REGION=ap-northeast-1##S3_BUCKET_NAME=keikakun-plan-deliverables##MAIL_FROM=noreply@keikakun.com##MAIL_SERVER=email-smtp.ap-northeast-1.amazonaws.com##MAIL_PORT=587##FRONTEND_URL=https://www.keikakun.com/##WEBAUTHN_RP_ID=www.keikakun.com##WEBAUTHN_RP_NAME=Keikakun##WEBAUTHN_ALLOWED_ORIGINS=https://www.keikakun.com##ENVIRONMENT=production##COOKIE_SECURE=true##COOKIE_DOMAIN=.keikakun.com##COOKIE_SAMESITE=none##PASSWORD_RESET_TOKEN_EXPIRE_MINUTES=30##RATE_LIMIT_FORGOT_PASSWORD=5/10minute##RATE_LIMIT_RESEND_EMAIL=3/10minute##STRIPE_PUBLISHABLE_KEY=pk_live_51SczUABzu2Qn9OhyRDORsFU6IdAa5KxkPj4WlfZ1qhsWipR6lKYDldJ24LyIDjigpZZlHfW6Us8IPc4f5mZ7Uz7w00lLP1uxjD##STRIPE_PRICE_ID=price_1Sd1zkBzu2Qn9Ohyp4oQyMHm##VAPID_PUBLIC_KEY=BBmBnPkVV0X-PdBZRYBr1Yra2xzkRIKuhHyEwJZObLoNTQtYxTiw248CJB1M9CtEqnWpl4JFZUFzkLTtugbObMs##VAPID_SUBJECT=mailto:support@keikakun.com##MAIL_STARTTLS=True##MAIL_SSL_TLS=False##MAIL_DEBUG=0'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/prod-database-url/versions/1
      env: PROD_DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/prod-test-database-url/versions/1
      env: PROD_TEST_DATABASE_URL

# ビルドしたイメージを保存する（全タグを明示的に指定して長期保持）
images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:$SHORT_SHA'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:$BRANCH_NAME-$SHORT_SHA'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/k-back-repo/k-back:latest'
